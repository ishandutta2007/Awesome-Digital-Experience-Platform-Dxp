loatSlow2 11s ease-in-out infinite}.grid-lines{stroke:#1e293b;stroke-opacity:.35;stroke-width:1}.flow-path{stroke-dasharray:8 12;animation:dashFlow 8s linear infinite}.badge-float-1{animation:floatSlow1 6s ease-in-out infinite}.badge-float-2{animation:floatSlow2 7s ease-in-out infinite}.badge-float-3{animation:floatSlow1 8s ease-in-out infinite 1s}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><g class="grid-lines"><line x1="100" x2="100" y1="0" y2="360"/><line x1="250" x2="250" y1="0" y2="360"/><line x1="400" x2="400" y1="0" y2="360"/><line x1="550" x2="550" y1="0" y2="360"/><line x1="700" x2="700" y1="0" y2="360"/><line x1="850" x2="850" y1="0" y2="360"/><line x1="1000" x2="1000" y1="0" y2="360"/><line x1="1150" x2="1150" y1="0" y2="360"/><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="300" y2="300"/></g><circle cx="200" cy="100" r="140" fill="#38bdf8" class="floating-orb-1" filter="url(#glow)"/><circle cx="1020" cy="220" r="160" fill="#c084fc" class="floating-orb-2" filter="url(#glow)"/><circle cx="600" cy="40" r="110" fill="#818cf8" filter="url(#glow)" opacity=".2"/><path fill="none" stroke="url(#accentGrad)" stroke-width="2.5" d="M 60 290 Q 300 350, 600 290 T 1140 280" class="flow-path" opacity=".4"/><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 80 80 Q 400 20, 800 80 T 1120 70" class="flow-path" opacity=".3"/><g class="badge-float-1" transform="translate(80, 42)"><rect width="130" height="30" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1.2" rx="15"/><circle cx="18" cy="15" r="4" fill="#38bdf8"/><text x="32" y="20" fill="#38bdf8" class="tag-text">COMPOSABLE</text></g><g class="badge-float-2" transform="translate(980, 42)"><rect width="140" height="30" fill="url(#pillGrad2)" stroke="#c084fc" stroke-opacity=".6" stroke-width="1.2" rx="15"/><circle cx="